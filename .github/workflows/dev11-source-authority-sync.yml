name: dev11-source-authority-sync

on:
  push:
    branches:
      - dev/0.1.0-dev.11-b2-auth

permissions:
  contents: write

jobs:
  sync-source-authority:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 4
          persist-credentials: true
      - name: Synchronize dev11 source authority
        run: python .github/dev11_source_authority_sync.py
