name: dev8-evidence-freeze

on:
  push:
    branches:
      - dev/v0.1.0-dev.8

permissions:
  contents: write

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  TESTINGPLATFORM_TELEMETRY_OPTOUT: '1'

jobs:
  freeze:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Install static dependencies
        run: python -m pip install --disable-pip-version-check --no-input "jsonschema==4.26.0" "pytest==9.0.2"
      - name: Remove bootstrap workflow from intended final tree
        run: git rm .github/workflows/dev8-evidence-freeze.yml
      - name: Regenerate exact evidence-frozen authority
        run: |
          python scripts/generate_sbom.py --mode source
          python scripts/verify_release_inputs.py
          python scripts/generate_sbom.py --mode release
          python scripts/generate_package_manifest.py
          python scripts/generate_hash_manifest.py
      - name: Verify intended final-tree gates
        run: |
          python scripts/verify_ci_actions.py
          python scripts/verify_contract_vectors.py
          python scripts/verify_repository.py
          python -m pytest -q tests/static
      - name: Commit evidence-frozen authority
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add machine-readable/source_sbom.spdx.json machine-readable/release_sbom.spdx.json machine-readable/package_manifest.json SHA256SUMS.txt
          git diff --cached --check
          git commit -m 'chore: freeze Converty 0.1.0-dev.8 evidence authority'
          git push origin HEAD:dev/v0.1.0-dev.8
