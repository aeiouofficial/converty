name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  TESTINGPLATFORM_TELEMETRY_OPTOUT: '1'

jobs:
  supply-chain-static:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Install static test dependency
        run: python -m pip install --disable-pip-version-check --no-input "jsonschema==4.26.0" "pytest==9.0.2"
      - name: Verify immutable CI action pins
        run: python scripts/verify_ci_actions.py
      - name: Generate deterministic source SBOM
        run: python scripts/generate_sbom.py --mode source
      - name: Verify release inputs
        run: python scripts/verify_release_inputs.py
      - name: Generate release dependency SBOM
        run: python scripts/generate_sbom.py --mode release
      - name: Regenerate SHA-256 workspace manifest
        run: python scripts/generate_hash_manifest.py
      - name: Upload supply-chain evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: converty-dev5-supply-chain-evidence
          path: |
            machine-readable/source_sbom.spdx.json
            machine-readable/release_sbom.spdx.json
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Verify raw contract vectors
        run: python scripts/verify_contract_vectors.py
      - name: Run static gates
        run: python -m pytest -q tests/static
      - name: Verify tracked generated authority is current
        run: git diff --exit-code -- machine-readable/source_sbom.spdx.json machine-readable/release_sbom.spdx.json SHA256SUMS.txt

  managed:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.400
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Install static test dependency
        shell: pwsh
        run: python -m pip install --disable-pip-version-check --no-input "jsonschema==4.26.0" "pytest==9.0.2"
      - name: Verify lock files and restore
        shell: pwsh
        run: ./build/bootstrap.ps1
      - name: Verify NuGet vulnerability audit
        shell: pwsh
        run: ./build/dependency-audit.ps1
      - name: Build
        shell: pwsh
        run: ./build/build.ps1 -Configuration Release
      - name: Test
        shell: pwsh
        run: ./build/test.ps1 -Configuration Release
      - name: Native topology smoke
        shell: pwsh
        run: ./build/native-smoke.ps1
