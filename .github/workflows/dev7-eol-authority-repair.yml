name: dev7-eol-authority-repair

on:
  push:
    branches:
      - hotfix/dev7-eol-authority
    paths:
      - .github/workflows/dev7-eol-authority-repair.yml

permissions:
  contents: write

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  TESTINGPLATFORM_TELEMETRY_OPTOUT: '1'

jobs:
  repair-dev7-authority:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          fetch-depth: 1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.400
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Install static dependencies
        shell: pwsh
        run: python -m pip install --disable-pip-version-check --no-input "jsonschema==4.26.0" "pytest==9.0.2"
      - name: Remove temporary repair workflow from final tree
        shell: pwsh
        run: git rm .github/workflows/dev7-eol-authority-repair.yml
      - name: Verify LF checkout policy
        shell: pwsh
        run: |
          @'
          import subprocess
          from pathlib import Path
          binary_exts = {'.png','.jpg','.jpeg','.gif','.ico','.zip','.docx','.pfx','.p12','.key','.pem'}
          files = subprocess.check_output(['git','ls-files'], text=True).splitlines()
          bad=[]
          for rel in files:
              p=Path(rel)
              if p.suffix.lower() in binary_exts or not p.is_file():
                  continue
              data=p.read_bytes()
              if b'\r\n' in data:
                  bad.append(rel)
          assert not bad, 'CRLF found in tracked text files: ' + ', '.join(bad[:20])
          print(f'LF checkout policy: PASS ({len(files)} tracked paths checked)')
          '@ | python -
      - name: Regenerate source release package and hash authority
        shell: pwsh
        run: |
          python scripts/generate_sbom.py --mode source
          python scripts/verify_release_inputs.py
          python scripts/generate_sbom.py --mode release
          python scripts/generate_package_manifest.py
          python scripts/generate_hash_manifest.py
      - name: Locked restore
        shell: pwsh
        run: ./build/bootstrap.ps1
      - name: Dependency audit
        shell: pwsh
        run: ./build/dependency-audit.ps1
      - name: Release build
        shell: pwsh
        run: ./build/build.ps1 -Configuration Release
      - name: Managed and static test suite
        shell: pwsh
        run: ./build/test.ps1 -Configuration Release
      - name: Native topology smoke
        shell: pwsh
        run: ./build/native-smoke.ps1
      - name: Verify release and repository gates
        shell: pwsh
        run: |
          python scripts/verify_ci_actions.py
          python scripts/verify_release_inputs.py
          python scripts/generate_sbom.py --mode source
          python scripts/generate_sbom.py --mode release
          python scripts/verify_contract_vectors.py
          python scripts/verify_repository.py
          python -m pytest -q tests/static
      - name: Record EOL authority repair
        shell: pwsh
        run: |
          $path = 'machine-readable/build_evidence.json'
          $evidence = Get-Content -Raw $path | ConvertFrom-Json
          $repair = [ordered]@{
            status = 'PASS'
            workflowRunId = [int64]$env:GITHUB_RUN_ID
            reason = 'Windows closure generated SHA256SUMS from CRLF working-tree bytes before Git normalized committed blobs to LF.'
            policy = '.gitattributes enforces text=auto eol=lf; repaired package/hash authority was generated from LF working-tree bytes.'
            managed = 'PASS_120_OF_120'
            releasePreflight = 'PASS'
            sourceSbom = 'PASS'
            releaseSbom = 'PASS'
            packageManifest = 'PASS_GENERATED'
            hashManifest = 'PASS_GENERATED'
            deterministicPackage = 'PASS'
          }
          Add-Member -InputObject $evidence -NotePropertyName eolAuthorityRepair -NotePropertyValue $repair -Force
          $evidence | ConvertTo-Json -Depth 20 | Set-Content -Encoding utf8NoBOM $path
      - name: Regenerate final manifests and verify exact bytes
        shell: pwsh
        run: |
          python scripts/generate_sbom.py --mode source
          python scripts/generate_sbom.py --mode release
          python scripts/generate_package_manifest.py
          python scripts/generate_hash_manifest.py
          python scripts/verify_repository.py
          python scripts/verify_contract_vectors.py
          python -m pytest -q tests/static
          @'
          import hashlib, json
          from pathlib import Path
          root=Path('.')
          def sha(p): return hashlib.sha256(p.read_bytes()).hexdigest()
          manifest=json.loads((root/'machine-readable/package_manifest.json').read_text(encoding='utf-8'))
          assert manifest['workspaceVersion']=='0.1.0-dev.7'
          for entry in manifest['files']:
              p=root/entry['path']
              assert p.is_file(), entry['path']
              assert p.stat().st_size==entry['bytes'], entry['path']
              assert sha(p)==entry['sha256'], entry['path']
          sums=(root/'SHA256SUMS.txt').read_text(encoding='utf-8').splitlines()
          for line in sums:
              digest,rel=line.split('  ',1)
              assert sha(root/rel)==digest, rel
          print(f'package manifest: PASS ({len(manifest["files"])} entries)')
          print(f'SHA256SUMS: PASS ({len(sums)} entries)')
          '@ | python -
      - name: Commit repaired final dev7 tree
        shell: pwsh
        run: |
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: normalize dev7 cross-platform hash authority"
          git push origin HEAD:hotfix/dev7-eol-authority
      - name: Package twice and verify deterministic ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/pkg-a, artifacts/pkg-b | Out-Null
          python scripts/package_workspace.py --output-dir artifacts/pkg-a
          python scripts/package_workspace.py --output-dir artifacts/pkg-b
          $a='artifacts/pkg-a/Converty_0.1.0-dev.7_full_workspace.zip'
          $b='artifacts/pkg-b/Converty_0.1.0-dev.7_full_workspace.zip'
          $ha=(Get-FileHash -Algorithm SHA256 $a).Hash.ToLowerInvariant()
          $hb=(Get-FileHash -Algorithm SHA256 $b).Hash.ToLowerInvariant()
          if ($ha -ne $hb) { throw "deterministic package hashes differ: $ha vs $hb" }
          @'
          import hashlib,json,zipfile
          from pathlib import Path
          archive=Path('artifacts/pkg-a/Converty_0.1.0-dev.7_full_workspace.zip')
          root='Converty_0.1.0-dev.7/'
          with zipfile.ZipFile(archive) as z:
              assert z.testzip() is None
              names=z.namelist()
              assert names and all(n.startswith(root) for n in names)
              assert z.read(root+'VERSION').decode().strip()=='0.1.0-dev.7'
              package=json.loads(z.read(root+'machine-readable/package_manifest.json'))
              for e in package['files']:
                  data=z.read(root+e['path'])
                  assert len(data)==e['bytes']
                  assert hashlib.sha256(data).hexdigest()==e['sha256'], e['path']
              sums=z.read(root+'SHA256SUMS.txt').decode().splitlines()
              for line in sums:
                  digest,rel=line.split('  ',1)
                  assert hashlib.sha256(z.read(root+rel)).hexdigest()==digest, rel
          meta={
            'archive':archive.name,
            'sha256':hashlib.sha256(archive.read_bytes()).hexdigest(),
            'bytes':archive.stat().st_size,
            'files':len(names),
            'packageManifestEntries':len(package['files']),
            'shaManifestEntries':len(sums),
            'crc':'PASS',
            'deterministicDoubleBuild':'PASS',
            'lineEndingAuthority':'LF',
            'root':root,
          }
          Path('artifacts/dev7-eol-package-evidence.json').write_text(json.dumps(meta,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(meta,indent=2))
          '@ | python -
      - name: Stage repaired delivery
        shell: pwsh
        run: |
          Copy-Item docs/HANDOVER_PROMPT.txt artifacts/Converty_0.1.0-dev.7_HANDOVER_PROMPT.txt
          Copy-Item machine-readable/build_evidence.json artifacts/Converty_0.1.0-dev.7_build_evidence.json
          Copy-Item artifacts/pkg-a/Converty_0.1.0-dev.7_full_workspace.zip artifacts/Converty_0.1.0-dev.7_full_workspace.zip
      - name: Upload repaired dev7 delivery
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: converty-dev7-eol-repaired-delivery
          path: |
            artifacts/Converty_0.1.0-dev.7_full_workspace.zip
            artifacts/Converty_0.1.0-dev.7_HANDOVER_PROMPT.txt
            artifacts/Converty_0.1.0-dev.7_build_evidence.json
            artifacts/dev7-eol-package-evidence.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
