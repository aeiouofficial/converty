name: main-promotion-authority-sync

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/main-promotion-authority-sync.yml

permissions:
  contents: write
  actions: read

jobs:
  sync-generated-authority:
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 4

      - name: Normalize committed bytes and verify source ancestor
        shell: pwsh
        run: |
          git config core.autocrlf false
          git reset --hard HEAD
          $source = (git rev-parse HEAD~3).Trim()
          if ($source -ne 'd01c8ba707b38c7bf35770f743e846437308fc57') {
            throw "Unexpected source ancestor: $source"
          }
          $dirty = @(git status --porcelain)
          if ($dirty.Count -ne 0) {
            throw "Worktree is dirty after byte normalization: $($dirty -join '; ')"
          }

      - name: Download and verify generated authority
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          Invoke-WebRequest -Headers $headers -Uri 'https://api.github.com/repos/aeiouofficial/converty/actions/artifacts/9718737873/zip' -OutFile authority.zip
          $zipHash = (Get-FileHash authority.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($zipHash -ne '5d0cda3715906782afe6c7989c267296085677f0e0db2de7ac7435c81584f31e') {
            throw "Authority ZIP hash mismatch: $zipHash"
          }
          Expand-Archive authority.zip authority
          $expected = @{
            'machine-readable/source_sbom.spdx.json' = 'edd4ba2c4bc96e3561dbae056f1a07fb0385d3dfb8dbccd9c35a36ace6e5173b'
            'machine-readable/release_sbom.spdx.json' = 'e195879a77276b8074c7bf01b8bf529d8f47138113f08774799ee41afee1ab46'
            'machine-readable/package_manifest.json' = 'edbad444e0377c4880a75180d7d9e731aac63a8dc9067e04c26e7f05bf5f0688'
            'SHA256SUMS.txt' = '93bebb79bdab4279c731c97a7bb9e2526cfe2bc3ed5637473652cc542e023480'
          }
          foreach ($entry in $expected.GetEnumerator()) {
            $path = Join-Path authority $entry.Key
            if (-not (Test-Path -LiteralPath $path)) { throw "Missing authority file: $($entry.Key)" }
            $hash = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($hash -ne $entry.Value) { throw "Hash mismatch for $($entry.Key): $hash" }
          }

      - name: Apply exact bytes and remove helper
        shell: pwsh
        run: |
          Copy-Item -LiteralPath 'authority/machine-readable/source_sbom.spdx.json' -Destination 'machine-readable/source_sbom.spdx.json' -Force
          Copy-Item -LiteralPath 'authority/machine-readable/release_sbom.spdx.json' -Destination 'machine-readable/release_sbom.spdx.json' -Force
          Copy-Item -LiteralPath 'authority/machine-readable/package_manifest.json' -Destination 'machine-readable/package_manifest.json' -Force
          Copy-Item -LiteralPath 'authority/SHA256SUMS.txt' -Destination 'SHA256SUMS.txt' -Force
          git rm -f -- '.github/workflows/main-promotion-authority-sync.yml'
          $changed = @(git diff HEAD --name-only)
          $allowed = @(
            '.github/workflows/main-promotion-authority-sync.yml',
            'machine-readable/source_sbom.spdx.json',
            'machine-readable/release_sbom.spdx.json',
            'machine-readable/package_manifest.json',
            'SHA256SUMS.txt'
          )
          foreach ($path in $changed) {
            if ($allowed -notcontains $path) { throw "Unexpected changed path: $path" }
          }
          if ($changed -notcontains '.github/workflows/main-promotion-authority-sync.yml') { throw 'Helper deletion missing from HEAD diff.' }
          if ($changed -notcontains 'machine-readable/package_manifest.json') { throw 'package_manifest.json did not change.' }
          if ($changed -notcontains 'SHA256SUMS.txt') { throw 'SHA256SUMS.txt did not change.' }
          $packageHash = (Get-FileHash 'machine-readable/package_manifest.json' -Algorithm SHA256).Hash.ToLowerInvariant()
          $sumHash = (Get-FileHash 'SHA256SUMS.txt' -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($packageHash -ne 'edbad444e0377c4880a75180d7d9e731aac63a8dc9067e04c26e7f05bf5f0688') { throw "Post-copy package hash mismatch: $packageHash" }
          if ($sumHash -ne '93bebb79bdab4279c731c97a7bb9e2526cfe2bc3ed5637473652cc542e023480') { throw "Post-copy SHA manifest hash mismatch: $sumHash" }

      - name: Commit exact generated authority atomically
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- SHA256SUMS.txt machine-readable/source_sbom.spdx.json machine-readable/release_sbom.spdx.json machine-readable/package_manifest.json .github/workflows/main-promotion-authority-sync.yml
          git commit -m 'chore: sync promoted main generated authority'
          git push origin HEAD:main
