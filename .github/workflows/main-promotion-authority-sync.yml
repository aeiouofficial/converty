name: main-promotion-authority-sync

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/main-promotion-authority-sync.yml

permissions:
  contents: write
  actions: read

jobs:
  sync-generated-authority:
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 8

      - name: Normalize and prove source tree authority
        shell: pwsh
        run: |
          git config core.autocrlf false
          git reset --hard HEAD
          git diff --exit-code d01c8ba707b38c7bf35770f743e846437308fc57 HEAD~2 --
          if ($LASTEXITCODE -ne 0) { throw 'Underlying parent tree is not the promotion metadata authority tree.' }
          $dirty = @(git status --porcelain)
          if ($dirty.Count -ne 0) { throw "Dirty normalized worktree: $($dirty -join '; ')" }

      - name: Download and verify exact generated authority outside checkout
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $zip = Join-Path $env:RUNNER_TEMP 'converty-authority.zip'
          $extract = Join-Path $env:RUNNER_TEMP 'converty-authority'
          if (Test-Path -LiteralPath $extract) { Remove-Item -LiteralPath $extract -Recurse -Force }
          Invoke-WebRequest -Headers $headers -Uri 'https://api.github.com/repos/aeiouofficial/converty/actions/artifacts/9718737873/zip' -OutFile $zip
          $zipHash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($zipHash -ne '5d0cda3715906782afe6c7989c267296085677f0e0db2de7ac7435c81584f31e') { throw "Authority ZIP hash mismatch: $zipHash" }
          Expand-Archive -LiteralPath $zip -DestinationPath $extract
          $expected = @{
            'machine-readable/source_sbom.spdx.json' = 'edd4ba2c4bc96e3561dbae056f1a07fb0385d3dfb8dbccd9c35a36ace6e5173b'
            'machine-readable/release_sbom.spdx.json' = 'e195879a77276b8074c7bf01b8bf529d8f47138113f08774799ee41afee1ab46'
            'machine-readable/package_manifest.json' = 'edbad444e0377c4880a75180d7d9e731aac63a8dc9067e04c26e7f05bf5f0688'
            'SHA256SUMS.txt' = '93bebb79bdab4279c731c97a7bb9e2526cfe2bc3ed5637473652cc542e023480'
          }
          foreach ($entry in $expected.GetEnumerator()) {
            $path = Join-Path $extract $entry.Key
            if (-not (Test-Path -LiteralPath $path)) { throw "Missing authority file: $($entry.Key)" }
            $hash = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($hash -ne $entry.Value) { throw "Hash mismatch for $($entry.Key): $hash" }
          }

      - name: Stage one verified transaction
        shell: pwsh
        run: |
          $extract = Join-Path $env:RUNNER_TEMP 'converty-authority'
          Copy-Item -LiteralPath (Join-Path $extract 'machine-readable/source_sbom.spdx.json') -Destination 'machine-readable/source_sbom.spdx.json' -Force
          Copy-Item -LiteralPath (Join-Path $extract 'machine-readable/release_sbom.spdx.json') -Destination 'machine-readable/release_sbom.spdx.json' -Force
          Copy-Item -LiteralPath (Join-Path $extract 'machine-readable/package_manifest.json') -Destination 'machine-readable/package_manifest.json' -Force
          Copy-Item -LiteralPath (Join-Path $extract 'SHA256SUMS.txt') -Destination 'SHA256SUMS.txt' -Force
          git rm -f -- '.github/workflows/main-promotion-authority-sync.yml'

          $packageHash = (Get-FileHash 'machine-readable/package_manifest.json' -Algorithm SHA256).Hash.ToLowerInvariant()
          $sumHash = (Get-FileHash 'SHA256SUMS.txt' -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($packageHash -ne 'edbad444e0377c4880a75180d7d9e731aac63a8dc9067e04c26e7f05bf5f0688') { throw "Post-copy package hash mismatch: $packageHash" }
          if ($sumHash -ne '93bebb79bdab4279c731c97a7bb9e2526cfe2bc3ed5637473652cc542e023480') { throw "Post-copy SHA manifest hash mismatch: $sumHash" }

          git add -A
          if ($LASTEXITCODE -ne 0) { throw 'git add -A failed.' }
          $staged = @(git diff --cached --name-only)
          $allowed = @(
            '.github/workflows/main-promotion-authority-sync.yml',
            'machine-readable/source_sbom.spdx.json',
            'machine-readable/release_sbom.spdx.json',
            'machine-readable/package_manifest.json',
            'SHA256SUMS.txt'
          )
          foreach ($path in $staged) {
            if ($allowed -notcontains $path) { throw "Unexpected staged path: $path" }
          }
          if ($staged -notcontains '.github/workflows/main-promotion-authority-sync.yml') { throw 'Helper deletion not staged.' }
          if ($staged -notcontains 'machine-readable/package_manifest.json') { throw 'package_manifest.json not staged.' }
          if ($staged -notcontains 'SHA256SUMS.txt') { throw 'SHA256SUMS.txt not staged.' }
          Write-Host "Staged authority transaction: $($staged -join ', ')"

      - name: Commit and push exact authority
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: sync promoted main generated authority'
          if ($LASTEXITCODE -ne 0) { throw 'git commit failed.' }
          git push origin HEAD:main
          if ($LASTEXITCODE -ne 0) { throw 'git push failed.' }
