name: dev5-rebrand-candidate

on:
  push:
    branches:
      - dev/v0.1.0-dev.5
  pull_request:
    branches:
      - main

permissions:
  contents: write

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  TESTINGPLATFORM_TELEMETRY_OPTOUT: '1'

jobs:
  qualify-rebrand:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.400
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Install static test dependencies
        run: python -m pip install --disable-pip-version-check --no-input "jsonschema==4.26.0" "pytest==9.0.2"
      - name: Create deterministic pre-rebrand snapshot
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          import zipfile

          root = Path.cwd()
          output = root / "converty-dev5-prebrand-snapshot.zip"
          skip_parts = {".git", ".pytest_cache", "bin", "obj", "artifacts", "__pycache__", ".packages"}
          files = []
          for path in root.rglob("*"):
              if not path.is_file() or path == output:
                  continue
              relative = path.relative_to(root)
              if any(part in skip_parts for part in relative.parts):
                  continue
              files.append(path)
          with zipfile.ZipFile(output, "w", compression=zipfile.ZIP_DEFLATED, compresslevel=9) as archive:
              for path in sorted(files, key=lambda item: item.relative_to(root).as_posix().lower()):
                  relative = path.relative_to(root).as_posix()
                  info = zipfile.ZipInfo(relative, (2026, 8, 24, 0, 0, 0))
                  info.compress_type = zipfile.ZIP_DEFLATED
                  info.external_attr = 0o100644 << 16
                  archive.writestr(info, path.read_bytes(), compress_type=zipfile.ZIP_DEFLATED, compresslevel=9)
          print(f"Created {output.name} with {len(files)} files")
          '@ | python -
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: converty-dev5-prebrand-snapshot
          path: converty-dev5-prebrand-snapshot.zip
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
      - name: Apply Converty rebrand migration in disposable checkout
        run: python scripts/dev5_rebrand_workspace.py
      - name: Generate and verify Converty lock files
        shell: pwsh
        run: ./build/bootstrap.ps1 -GenerateLockFiles
      - name: Assert exactly seven lock files
        shell: pwsh
        run: |
          $locks = @(Get-ChildItem -Path . -Filter packages.lock.json -Recurse -File)
          if ($locks.Count -ne 7) {
            throw "Expected exactly 7 packages.lock.json files, found $($locks.Count)."
          }
          $locks | ForEach-Object { Write-Host $_.FullName }
      - name: Regenerate source SBOM and hash manifest
        shell: pwsh
        run: |
          python scripts/generate_sbom.py --mode source
          python scripts/generate_hash_manifest.py
      - name: Verify immutable CI action pins
        run: python scripts/verify_ci_actions.py
      - name: Verify raw contract vectors
        run: python scripts/verify_contract_vectors.py
      - name: Run complete static gates on transformed tree
        run: python -m pytest -q tests/static
      - name: Verify real NuGet vulnerability audit
        shell: pwsh
        run: ./build/dependency-audit.ps1
      - name: Build transformed workspace
        shell: pwsh
        run: ./build/build.ps1 -Configuration Release
      - name: Test transformed workspace
        shell: pwsh
        run: ./build/test.ps1 -Configuration Release
      - name: Native topology smoke
        shell: pwsh
        run: ./build/native-smoke.ps1
      - name: Commit qualified Converty rebrand to dev.5
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev/v0.1.0-dev.5'
        shell: pwsh
        run: |
          if (Test-Path 'converty-dev5-prebrand-snapshot.zip') {
            Remove-Item 'converty-dev5-prebrand-snapshot.zip' -Force
          }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          $changes = git status --porcelain
          if (-not $changes) {
            Write-Host 'Qualified tree already matches the branch; nothing to publish.'
            exit 0
          }
          git commit -m 'refactor: rebrand FileConvert to Converty'
          if ($LASTEXITCODE -ne 0) { throw 'git commit failed.' }
          git push origin 'HEAD:dev/v0.1.0-dev.5'
          if ($LASTEXITCODE -ne 0) { throw 'git push failed.' }
      - name: Create deterministic transformed workspace artifact
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          import zipfile

          root = Path.cwd()
          output = root / "converty-dev5-rebrand-candidate.zip"
          skip_parts = {".git", ".pytest_cache", "bin", "obj", "artifacts", "__pycache__", ".packages"}
          files = []
          for path in root.rglob("*"):
              if not path.is_file() or path == output:
                  continue
              relative = path.relative_to(root)
              if any(part in skip_parts for part in relative.parts):
                  continue
              files.append(path)
          with zipfile.ZipFile(output, "w", compression=zipfile.ZIP_DEFLATED, compresslevel=9) as archive:
              for path in sorted(files, key=lambda item: item.relative_to(root).as_posix().lower()):
                  relative = path.relative_to(root).as_posix()
                  info = zipfile.ZipInfo(relative, (2026, 8, 24, 0, 0, 0))
                  info.compress_type = zipfile.ZIP_DEFLATED
                  info.external_attr = 0o100644 << 16
                  archive.writestr(info, path.read_bytes(), compress_type=zipfile.ZIP_DEFLATED, compresslevel=9)
          print(f"Created {output.name} with {len(files)} files")
          '@ | python -
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: converty-dev5-rebrand-candidate
          path: converty-dev5-rebrand-candidate.zip
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
