name: dev12-source-authority-sync

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  sync:
    if: github.event.head_commit.message == 'chore: stage dev12 source authority sync'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Verify source parent and synchronize dev12 authority
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^:VERSION)" = "0.1.0-dev.11"
          git merge-base --is-ancestor f4c241b0895d06d2e44d72f31e07f141cdc74577 HEAD
          python .github/dev12_source_authority_sync.py
          allowed='^(VERSION|README.md|CHANGELOG.md|eng/toolchain.json|machine-readable/(release_policy.json|ci_action_pins.json|handover_state.json|build_evidence.json)|docs/(HANDOVER_NEXT_AGENT.md|HANDOVER_PROMPT.txt|TASK_BACKLOG.md|TEST_AND_RELEASE_GATES.md|development/IMPLEMENTATION_STATUS.md)|\.github/dev12_source_authority_sync.py|\.github/workflows/dev12-source-authority-sync.yml)$'
          changed="$(git status --short | sed -E 's/^.. //' | sort)"
          printf '%s\n' "$changed"
          while IFS= read -r path; do
            [ -z "$path" ] && continue
            printf '%s\n' "$path" | grep -Eq "$allowed" || { echo "unexpected changed path: $path"; exit 1; }
          done <<< "$changed"
          git add -A
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'docs: synchronize dev12 source authority'
          git push origin HEAD:main
