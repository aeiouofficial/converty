name: release-readiness

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  readiness:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Install hash-locked verifier dependencies
        run: >-
          python -m pip install --disable-pip-version-check --no-input --require-hashes --only-binary=:all: -r eng/ci-python-requirements.txt
      - name: Verify release readiness
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python scripts/verify_release_readiness.py --require-ready --live-github
