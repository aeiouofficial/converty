name: dev11-authority-sync

on:
  push:
    branches:
      - dev/0.1.0-dev.11-b2-auth

permissions:
  actions: read
  contents: write

jobs:
  sync-authority:
    if: github.sha != '1d4c22733c43f4eee4a4a4cd6751608e60359561'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: true
      - name: Verify one-shot sync parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "1d4c22733c43f4eee4a4a4cd6751608e60359561"
      - name: Download and verify exact generated-authority artifact
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/9704347129/zip" > authority.zip
          echo "bc14c32c9618b06ddf040a9373c4aa0ad9270a9f165260571f4031289a3a1798  authority.zip" | sha256sum -c -
          rm -rf authority
          mkdir authority
          unzip -q authority.zip -d authority
          python - <<'PY'
          from pathlib import Path
          expected = {
              'SHA256SUMS.txt',
              'machine-readable/source_sbom.spdx.json',
              'machine-readable/release_sbom.spdx.json',
              'machine-readable/package_manifest.json',
          }
          actual = {p.as_posix().removeprefix('authority/') for p in Path('authority').rglob('*') if p.is_file()}
          if actual != expected:
              raise SystemExit(f'unexpected authority artifact contents: {sorted(actual)}')
          PY
          echo "affb44e09348d795400d7b01240b7708fa58d50b4865b67b58a4c9c4696e3165  authority/SHA256SUMS.txt" | sha256sum -c -
          echo "40927a8976dc0964341899529ffc2b00c6235f6b7be4fe9e62a2cafded9e1fbc  authority/machine-readable/package_manifest.json" | sha256sum -c -
          echo "93d92ee00c6901cb35bc2c4fd369f48de6119894e49f337afd8f8797f18299c5  authority/machine-readable/release_sbom.spdx.json" | sha256sum -c -
          echo "8b6879db61de1ecc775e319b3f97fafea20090ab63cc413aa82e26a7c3c1d0c8  authority/machine-readable/source_sbom.spdx.json" | sha256sum -c -
      - name: Apply exact authority bytes and remove sync helper
        shell: bash
        run: |
          set -euo pipefail
          cp authority/SHA256SUMS.txt SHA256SUMS.txt
          cp authority/machine-readable/source_sbom.spdx.json machine-readable/source_sbom.spdx.json
          cp authority/machine-readable/release_sbom.spdx.json machine-readable/release_sbom.spdx.json
          cp authority/machine-readable/package_manifest.json machine-readable/package_manifest.json
          rm .github/workflows/dev11-authority-sync.yml
          python - <<'PY'
          import subprocess
          expected = {
              '.github/workflows/dev11-authority-sync.yml',
              'SHA256SUMS.txt',
              'machine-readable/source_sbom.spdx.json',
              'machine-readable/release_sbom.spdx.json',
              'machine-readable/package_manifest.json',
          }
          actual = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          if actual != expected:
              raise SystemExit(f'unexpected sync delta: {sorted(actual)}')
          PY
      - name: Commit exact artifact bytes atomically
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SHA256SUMS.txt machine-readable/source_sbom.spdx.json machine-readable/release_sbom.spdx.json machine-readable/package_manifest.json .github/workflows/dev11-authority-sync.yml
          git commit -m "chore: sync dev11 generated authority"
          git push origin "HEAD:${GITHUB_REF_NAME}"
