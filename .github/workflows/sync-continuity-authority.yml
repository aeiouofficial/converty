name: sync-continuity-authority

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/sync-continuity-authority.yml

permissions:
  contents: write
  actions: read

jobs:
  sync-generated-authority:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Verify exact source parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "7cf6d426a7376a08ec27b40961c1e31c98e2555d"
          test -z "$(git status --porcelain)"

      - name: Download and verify exact generated authority
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          zip="$RUNNER_TEMP/authority.zip"
          out="$RUNNER_TEMP/authority"
          curl --fail-with-body --location \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/aeiouofficial/converty/actions/artifacts/9719366568/zip" \
            --output "$zip"
          echo "d1fdd6b745e48e1117afd8ad781e0052b060d29e6b1dad0ae9c52f1070c5e785  $zip" | sha256sum --check --status
          mkdir -p "$out"
          unzip -q "$zip" -d "$out"
          echo "edd4ba2c4bc96e3561dbae056f1a07fb0385d3dfb8dbccd9c35a36ace6e5173b  $out/machine-readable/source_sbom.spdx.json" | sha256sum --check --status
          echo "e195879a77276b8074c7bf01b8bf529d8f47138113f08774799ee41afee1ab46  $out/machine-readable/release_sbom.spdx.json" | sha256sum --check --status
          echo "0309ee37c2f166937552e7aa65d52ddec22e8070b839eafd2fb198f09358fab0  $out/machine-readable/package_manifest.json" | sha256sum --check --status
          echo "15470b7052de6943ef38a0bd7775b9593fdd512333cb1c62c723315e03bd9494  $out/SHA256SUMS.txt" | sha256sum --check --status

      - name: Stage exact authority transaction
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/authority"
          cp "$out/machine-readable/package_manifest.json" machine-readable/package_manifest.json
          cp "$out/SHA256SUMS.txt" SHA256SUMS.txt
          git rm -- .github/workflows/sync-continuity-authority.yml
          git add -A
          mapfile -t staged < <(git diff --cached --name-only)
          printf '%s\n' "${staged[@]}"
          expected=(
            ".github/workflows/sync-continuity-authority.yml"
            "SHA256SUMS.txt"
            "machine-readable/package_manifest.json"
          )
          test "${#staged[@]}" -eq "${#expected[@]}"
          for i in "${!expected[@]}"; do
            test "${staged[$i]}" = "${expected[$i]}"
          done
          echo "0309ee37c2f166937552e7aa65d52ddec22e8070b839eafd2fb198f09358fab0  machine-readable/package_manifest.json" | sha256sum --check --status
          echo "15470b7052de6943ef38a0bd7775b9593fdd512333cb1c62c723315e03bd9494  SHA256SUMS.txt" | sha256sum --check --status

      - name: Commit and push exact authority
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: sync continuity generated authority'
          git push origin HEAD:main
