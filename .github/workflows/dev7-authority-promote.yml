name: dev7-authority-promote

on:
  push:
    branches:
      - dev/v0.1.0-dev.7
    paths:
      - .github/workflows/dev7-authority-promote.yml

permissions:
  contents: write

jobs:
  promote:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          fetch-depth: 1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Install static dependencies
        run: python -m pip install --disable-pip-version-check --no-input "jsonschema==4.26.0" "pytest==9.0.2"
      - name: Remove bootstrap workflow from intended final tree
        run: git rm .github/workflows/dev7-authority-promote.yml
      - name: Regenerate exact final-tree authority
        run: |
          python scripts/generate_sbom.py --mode source
          python scripts/verify_release_inputs.py
          python scripts/generate_sbom.py --mode release
          python scripts/generate_package_manifest.py
          python scripts/generate_hash_manifest.py
      - name: Verify final-tree static gates
        run: |
          python scripts/verify_ci_actions.py
          python scripts/verify_contract_vectors.py
          python scripts/verify_repository.py
          python -m pytest -q tests/static
      - name: Verify manifest contents before commit
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path('.')
          def sha(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()
          package = json.loads((root / 'machine-readable/package_manifest.json').read_text(encoding='utf-8'))
          assert package['workspaceVersion'] == '0.1.0-dev.7'
          for entry in package['files']:
              path = root / entry['path']
              assert path.is_file(), entry['path']
              assert path.stat().st_size == entry['bytes'], entry['path']
              assert sha(path) == entry['sha256'], entry['path']
          sums = (root / 'SHA256SUMS.txt').read_text(encoding='utf-8').splitlines()
          for line in sums:
              digest, rel = line.split('  ', 1)
              path = root / rel
              assert path.is_file(), rel
              assert sha(path) == digest, rel
          print(f"package manifest: PASS ({len(package['files'])} entries)")
          print(f"SHA256SUMS: PASS ({len(sums)} entries)")
          PY
      - name: Commit exact generated authority
        run: |
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: freeze Converty 0.1.0-dev.7 authority"
          git push origin HEAD:dev/v0.1.0-dev.7
