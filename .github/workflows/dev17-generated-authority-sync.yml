name: dev17-generated-authority-sync

on:
  push:
    branches:
      - dev/0.1.0-dev.17-audio-batch-isolation

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 3
      - name: Guard exact authority source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "3270062b3096bba6299b790e173e252ca71ff9a6"
          test "$(git rev-parse HEAD^^)" = "576c3d887dfef307f85b9f44532eb54f905f94aa"
          test "${GITHUB_REF_NAME}" = "dev/0.1.0-dev.17-audio-batch-isolation"
      - name: Download and verify exact generated authority
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9743026950/zip" \
            --output /tmp/dev17-generated-authority.zip
          python - <<'PY'
          import hashlib, json, pathlib, zipfile
          artifact = pathlib.Path('/tmp/dev17-generated-authority.zip')
          expected_zip_sha = '259771f5b165d0754d0f22d6c9c4e49a69794c28226febb8bb501d25eea3e88e'
          expected = {
              'SHA256SUMS.txt',
              'machine-readable/package_manifest.json',
              'machine-readable/release_sbom.spdx.json',
              'machine-readable/source_sbom.spdx.json',
          }
          actual = hashlib.sha256(artifact.read_bytes()).hexdigest()
          if actual != expected_zip_sha:
              raise SystemExit(f'artifact digest mismatch: {actual}')
          with zipfile.ZipFile(artifact) as z:
              if z.testzip() is not None:
                  raise SystemExit('generated authority ZIP CRC failure')
              names = set(z.namelist())
              if names != expected:
                  raise SystemExit(f'unexpected artifact members: {sorted(names)}')
              package = json.loads(z.read('machine-readable/package_manifest.json'))
              if package.get('workspaceVersion') != '0.1.0-dev.17':
                  raise SystemExit('generated package manifest version mismatch')
              source = json.loads(z.read('machine-readable/source_sbom.spdx.json'))
              release = json.loads(z.read('machine-readable/release_sbom.spdx.json'))
              if source.get('name') != 'Converty-source-0.1.0-dev.17':
                  raise SystemExit('source SBOM version mismatch')
              if release.get('name') != 'Converty-release-0.1.0-dev.17':
                  raise SystemExit('release SBOM version mismatch')
              for name in sorted(expected):
                  target = pathlib.Path(name)
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(z.read(name))
          PY
      - name: Self-delete and commit exact generated paths
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/dev17-generated-authority-sync.yml
          mapfile -t paths < <(git status --porcelain=v1 | sed -E 's/^.. //' | sort)
          expected=(
            '.github/workflows/dev17-generated-authority-sync.yml'
            'SHA256SUMS.txt'
            'machine-readable/package_manifest.json'
            'machine-readable/release_sbom.spdx.json'
            'machine-readable/source_sbom.spdx.json'
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          test "$(printf '%s\n' "${paths[@]}")" = "$(printf '%s\n' "${expected_sorted[@]}")"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- "${expected[@]}"
          git diff --cached --name-only | sort > /tmp/staged.txt
          printf '%s\n' "${expected_sorted[@]}" > /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/staged.txt
          git commit -m 'chore: synchronize dev17 generated authority'
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:"${GITHUB_REF_NAME}"
