name: dev12-generated-authority-sync

on:
  push:
    branches:
      - main

permissions:
  actions: read
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Synchronize exact dev12 generated authority
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "12613aeee8ddbbca68f6990b1cde33d59e34518a"
          zip="$RUNNER_TEMP/dev12-authority.zip"
          out="$RUNNER_TEMP/dev12-authority"
          gh api /repos/aeiouofficial/converty/actions/artifacts/9720291273/zip > "$zip"
          echo "8b26eb9f2dff9eed66fa31ebdbacdc972f752ee7962bfb5f8dbee5da6a1ca751  $zip" | sha256sum -c -
          mkdir -p "$out"
          unzip -q "$zip" -d "$out"
          cp "$out/machine-readable/source_sbom.spdx.json" machine-readable/source_sbom.spdx.json
          cp "$out/machine-readable/release_sbom.spdx.json" machine-readable/release_sbom.spdx.json
          cp "$out/machine-readable/package_manifest.json" machine-readable/package_manifest.json
          cp "$out/SHA256SUMS.txt" SHA256SUMS.txt
          git rm .github/workflows/dev12-generated-authority-sync.yml
          changed="$(git status --short | sed -E 's/^.. //' | sort)"
          printf '%s\n' "$changed"
          while IFS= read -r path; do
            [ -z "$path" ] && continue
            case "$path" in
              .github/workflows/dev12-generated-authority-sync.yml|SHA256SUMS.txt|machine-readable/source_sbom.spdx.json|machine-readable/release_sbom.spdx.json|machine-readable/package_manifest.json) ;;
              *) echo "unexpected changed path: $path"; exit 1 ;;
            esac
          done <<< "$changed"
          git add -A
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'chore: synchronize dev12 generated authority'
          git push origin HEAD:main
