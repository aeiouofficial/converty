name: dev5-sync-generated

on:
  push:
    branches:
      - dev/v0.1.0-dev.5-closure

permissions:
  contents: write

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  sync-generated:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Generate exact tracked authority
        run: |
          python scripts/generate_sbom.py --mode source
          python scripts/generate_sbom.py --mode release
          python scripts/generate_hash_manifest.py
      - name: Commit exact generated authority
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add machine-readable/source_sbom.spdx.json machine-readable/release_sbom.spdx.json SHA256SUMS.txt
          if git diff --cached --quiet; then
            echo 'Generated authority already current.'
            exit 0
          fi
          git commit -m 'chore: sync exact dev5 generated authority'
          git push origin HEAD:dev/v0.1.0-dev.5-closure
