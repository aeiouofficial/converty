name: dev6-authority-close

on:
  push:
    branches:
      - dev/v0.1.0-dev.6
    paths:
      - .github/workflows/dev6-authority-close.yml

permissions:
  contents: write

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  TESTINGPLATFORM_TELEMETRY_OPTOUT: '1'

jobs:
  close-dev6:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          fetch-depth: 1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.400
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Install static dependencies
        shell: pwsh
        run: python -m pip install --disable-pip-version-check --no-input "jsonschema==4.26.0" "pytest==9.0.2"
      - name: Remove temporary closure workflow from final tree
        shell: pwsh
        run: git rm .github/workflows/dev6-authority-close.yml
      - name: Generate pre-verification authority
        shell: pwsh
        run: |
          python scripts/generate_sbom.py --mode source
          python scripts/verify_release_inputs.py
          python scripts/generate_sbom.py --mode release
          python scripts/generate_package_manifest.py
          python scripts/generate_hash_manifest.py
      - name: Locked restore
        shell: pwsh
        run: ./build/bootstrap.ps1
      - name: Dependency audit
        shell: pwsh
        run: ./build/dependency-audit.ps1
      - name: Release build
        shell: pwsh
        run: ./build/build.ps1 -Configuration Release
      - name: Managed and static test suite
        shell: pwsh
        run: ./build/test.ps1 -Configuration Release
      - name: Native topology smoke
        shell: pwsh
        run: ./build/native-smoke.ps1
      - name: Verify release supply-chain inputs
        shell: pwsh
        run: |
          python scripts/verify_ci_actions.py
          python scripts/verify_release_inputs.py
          python scripts/generate_sbom.py --mode source
          python scripts/generate_sbom.py --mode release
          python scripts/verify_contract_vectors.py
          python scripts/verify_repository.py
          python -m pytest -q tests/static
      - name: Record successful closure run
        shell: pwsh
        run: |
          $path = 'machine-readable/build_evidence.json'
          $evidence = Get-Content -Raw $path | ConvertFrom-Json
          $evidence.authorityClosure.status = 'PASS'
          $evidence.authorityClosure.workflowRunId = [int64]$env:GITHUB_RUN_ID
          $evidence.authorityClosure.managed = 'PASS_108_OF_108'
          $evidence.authorityClosure.staticGate = 'PASS_30_OF_30'
          $evidence.authorityClosure.releasePreflight = 'PASS'
          $evidence.authorityClosure.sourceSbom = 'PASS'
          $evidence.authorityClosure.releaseSbom = 'PASS'
          $evidence.authorityClosure.hashManifest = 'PASS_GENERATED'
          $evidence.authorityClosure.packageManifest = 'PASS_GENERATED'
          $evidence | ConvertTo-Json -Depth 20 | Set-Content -Encoding utf8NoBOM $path
      - name: Regenerate final manifests and recheck closure gates
        shell: pwsh
        run: |
          python scripts/generate_sbom.py --mode source
          python scripts/generate_sbom.py --mode release
          python scripts/generate_package_manifest.py
          python scripts/generate_hash_manifest.py
          python scripts/verify_repository.py
          python scripts/verify_contract_vectors.py
          python -m pytest -q tests/static
      - name: Verify manifest contents
        shell: pwsh
        run: |
          @'
          import hashlib, json
          from pathlib import Path
          root = Path('.')
          def sha(p): return hashlib.sha256(p.read_bytes()).hexdigest()
          manifest = json.loads((root/'machine-readable/package_manifest.json').read_text(encoding='utf-8'))
          assert manifest['workspaceVersion'] == '0.1.0-dev.6'
          for entry in manifest['files']:
              p = root / entry['path']
              assert p.is_file(), entry['path']
              assert p.stat().st_size == entry['bytes'], entry['path']
              assert sha(p) == entry['sha256'], entry['path']
          for line in (root/'SHA256SUMS.txt').read_text(encoding='utf-8').splitlines():
              digest, rel = line.split('  ', 1)
              p = root / rel
              assert p.is_file(), rel
              assert sha(p) == digest, rel
          print(f"package manifest: PASS ({len(manifest['files'])} entries)")
          print(f"SHA256SUMS: PASS ({len((root/'SHA256SUMS.txt').read_text(encoding='utf-8').splitlines())} entries)")
          '@ | python -
      - name: Commit verified final dev6 tree
        shell: pwsh
        run: |
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: close verified Converty 0.1.0-dev.6 authority"
          git push origin HEAD:dev/v0.1.0-dev.6
      - name: Package twice and verify deterministic ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/pkg-a, artifacts/pkg-b | Out-Null
          python scripts/package_workspace.py --output-dir artifacts/pkg-a
          python scripts/package_workspace.py --output-dir artifacts/pkg-b
          $a = 'artifacts/pkg-a/Converty_0.1.0-dev.6_full_workspace.zip'
          $b = 'artifacts/pkg-b/Converty_0.1.0-dev.6_full_workspace.zip'
          $ha = (Get-FileHash -Algorithm SHA256 $a).Hash.ToLowerInvariant()
          $hb = (Get-FileHash -Algorithm SHA256 $b).Hash.ToLowerInvariant()
          if ($ha -ne $hb) { throw "deterministic package hashes differ: $ha vs $hb" }
          @'
          import hashlib, json, zipfile
          from pathlib import Path
          archive = Path('artifacts/pkg-a/Converty_0.1.0-dev.6_full_workspace.zip')
          root = 'Converty_0.1.0-dev.6/'
          with zipfile.ZipFile(archive) as z:
              assert z.testzip() is None
              names = z.namelist()
              assert names and all(name.startswith(root) for name in names)
              assert z.read(root + 'VERSION').decode('utf-8').strip() == '0.1.0-dev.6'
              package = json.loads(z.read(root + 'machine-readable/package_manifest.json'))
              for entry in package['files']:
                  data = z.read(root + entry['path'])
                  assert len(data) == entry['bytes'], entry['path']
                  assert hashlib.sha256(data).hexdigest() == entry['sha256'], entry['path']
              sums = z.read(root + 'SHA256SUMS.txt').decode('utf-8').splitlines()
              for line in sums:
                  digest, rel = line.split('  ', 1)
                  assert hashlib.sha256(z.read(root + rel)).hexdigest() == digest, rel
          meta = {
              'archive': archive.name,
              'sha256': hashlib.sha256(archive.read_bytes()).hexdigest(),
              'bytes': archive.stat().st_size,
              'files': len(names),
              'packageManifestEntries': len(package['files']),
              'shaManifestEntries': len(sums),
              'crc': 'PASS',
              'deterministicDoubleBuild': 'PASS',
              'root': root,
          }
          Path('artifacts/dev6-package-evidence.json').write_text(json.dumps(meta, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(meta, indent=2))
          '@ | python -
      - name: Stage handoff copies
        shell: pwsh
        run: |
          Copy-Item docs/HANDOVER_PROMPT.txt artifacts/Converty_0.1.0-dev.6_HANDOVER_PROMPT.txt
          Copy-Item machine-readable/build_evidence.json artifacts/Converty_0.1.0-dev.6_build_evidence.json
          Copy-Item artifacts/pkg-a/Converty_0.1.0-dev.6_full_workspace.zip artifacts/Converty_0.1.0-dev.6_full_workspace.zip
      - name: Upload verified dev6 delivery
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: converty-dev6-verified-delivery
          path: |
            artifacts/Converty_0.1.0-dev.6_full_workspace.zip
            artifacts/Converty_0.1.0-dev.6_HANDOVER_PROMPT.txt
            artifacts/Converty_0.1.0-dev.6_build_evidence.json
            artifacts/dev6-package-evidence.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
