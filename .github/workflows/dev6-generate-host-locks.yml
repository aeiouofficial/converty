name: dev6-generate-host-locks

on:
  push:
    branches:
      - dev/v0.1.0-dev.6

permissions:
  contents: write

jobs:
  generate-locks:
    runs-on: windows-2025
    timeout-minutes: 15
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
      TESTINGPLATFORM_TELEMETRY_OPTOUT: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 10.0.400
      - name: Generate and verify lock files
        shell: pwsh
        run: ./build/bootstrap.ps1 -GenerateLockFiles
      - name: Commit generated Host lock files
        shell: pwsh
        run: |
          git add src/Converty.Host/packages.lock.json tests/Converty.Host.Tests/packages.lock.json
          if (git diff --cached --quiet) { exit 0 }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: generate Host lock files"
          git push origin HEAD:dev/v0.1.0-dev.6
