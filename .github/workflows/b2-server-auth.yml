name: b2-server-auth

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  TESTINGPLATFORM_TELEMETRY_OPTOUT: '1'

jobs:
  shell-launched-bridge-identity:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Normalize worktree to committed bytes
        shell: pwsh
        run: |
          git config core.autocrlf false
          git reset --hard HEAD
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.400
      - name: Verify lock files and restore
        shell: pwsh
        run: ./build/bootstrap.ps1
      - name: Build
        shell: pwsh
        run: ./build/build.ps1 -Configuration Release
      - name: Native Explorer smoke
        shell: pwsh
        run: ./build/native-smoke.ps1
      - name: Prepare pinned development FFmpeg
        shell: pwsh
        run: ./build/prepare-dev-ffmpeg.ps1
      - name: Stage development package
        shell: pwsh
        run: ./build/stage-dev-package.ps1 -Configuration Release -FfmpegPath ./artifacts/dev-ffmpeg/ffmpeg.exe
      - name: B2 shell-launched Bridge package identity diagnostic
        shell: pwsh
        run: ./build/b2-bridge-package-identity-diagnostic.ps1 -Configuration Release
