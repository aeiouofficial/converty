name: dev21-generated-authority-sync

on:
  push:
    branches:
      - dev/0.1.0-dev.21

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact staging commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Guard exact branch and exact curated parent
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "dev/0.1.0-dev.21"
          test "$(git rev-parse HEAD^)" = "3b78831496740075759415eb9c5c4de34d27f30c"
      - name: Download and independently pinned generated authority
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fL --retry 3 \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/10545184592/zip" \
            -o /tmp/generated-authority.zip
          echo "6c400c68f73f11b32740849fbb66856dc7128b23da7055b0f8a118528eec1e6c  /tmp/generated-authority.zip" | sha256sum -c -
          python - <<'PY'
          import hashlib, json, pathlib, zipfile
          archive = pathlib.Path('/tmp/generated-authority.zip')
          expected = {
              'SHA256SUMS.txt': '8afa6a99a278da3dfaaf5993d09fc2f05a4c03e4032a5d1b68403b0061613e7d',
              'machine-readable/package_manifest.json': '6e06a113fb8187bb8dcc0791c9dc064733c1cd876703f61e85d910c5c5136946',
              'machine-readable/release_sbom.spdx.json': '7e6b35477b72799f814e090629f5dddd89115dfe9f9dd8e103bb7f071b38c7f4',
              'machine-readable/source_sbom.spdx.json': '91dec7004f33eaee74223b47f786aa2546cdc8442b8958bb87aabedc3a1db907',
          }
          with zipfile.ZipFile(archive) as z:
              assert z.testzip() is None
              assert set(z.namelist()) == set(expected)
              for name, digest in expected.items():
                  data = z.read(name)
                  assert hashlib.sha256(data).hexdigest() == digest, name
              package = json.loads(z.read('machine-readable/package_manifest.json'))
              source = json.loads(z.read('machine-readable/source_sbom.spdx.json'))
              release = json.loads(z.read('machine-readable/release_sbom.spdx.json'))
              assert package['workspaceVersion'] == '0.1.0-dev.21'
              assert source['name'] == 'Converty-source-0.1.0-dev.21'
              assert release['name'] == 'Converty-release-0.1.0-dev.21'
              z.extractall('.')
          PY
      - name: Self-delete and commit only generated authority
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm .github/workflows/dev21-generated-authority-sync.yml
          python - <<'PY'
          import subprocess
          expected = {
              '.github/workflows/dev21-generated-authority-sync.yml',
              'SHA256SUMS.txt',
              'machine-readable/package_manifest.json',
              'machine-readable/release_sbom.spdx.json',
              'machine-readable/source_sbom.spdx.json',
          }
          lines = subprocess.check_output(['git','status','--porcelain=v1'], text=True).splitlines()
          actual = {line[3:] for line in lines if line.strip()}
          assert actual == expected, (actual, expected)
          PY
          git add -- .github/workflows/dev21-generated-authority-sync.yml SHA256SUMS.txt machine-readable/package_manifest.json machine-readable/release_sbom.spdx.json machine-readable/source_sbom.spdx.json
          python - <<'PY'
          import subprocess
          expected = [
              '.github/workflows/dev21-generated-authority-sync.yml',
              'SHA256SUMS.txt',
              'machine-readable/package_manifest.json',
              'machine-readable/release_sbom.spdx.json',
              'machine-readable/source_sbom.spdx.json',
          ]
          actual = subprocess.check_output(['git','diff','--cached','--name-only'], text=True).splitlines()
          assert sorted(actual) == sorted(expected), actual
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: synchronize dev21 generated authority"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:dev/0.1.0-dev.21
